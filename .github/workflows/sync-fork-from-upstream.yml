name: 'sync-fork-from-upstream'

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    # The mirror step adds an "upstream" remote, and gh prefers a remote named
    # "upstream" over "origin" when inferring the repo. Without this, every gh
    # call below silently targets rclone-ui/rclone-ui instead of this fork.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout personal_changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: personal_changes

      - name: Mirror main from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rclone-ui/rclone-ui.git
          git fetch upstream
          git fetch origin main

          BEFORE=$(git rev-parse origin/main)
          git checkout -B upstream-mirror upstream/main

          # GITHUB_TOKEN may not push changes to workflow files, so main keeps its
          # own frozen copy of .github/workflows instead of upstream's
          git rm -r -q --ignore-unmatch .github/workflows
          git checkout origin/main -- .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "ci: keep fork workflows in upstream mirror"
          fi

          if [ "$(git rev-parse origin/main^{tree})" = "$(git rev-parse HEAD^{tree})" ]; then
            echo "main already matches sanitized upstream/main, nothing to mirror"
            echo "UPSTREAM_CHANGED=false" >> $GITHUB_ENV
          else
            git log --reverse --oneline origin/main..upstream/main > "$GITHUB_WORKSPACE/upstream-commits.txt"
            git push origin "HEAD:refs/heads/main" --force-with-lease="refs/heads/main:$BEFORE"
            echo "UPSTREAM_CHANGED=true" >> $GITHUB_ENV
          fi

      - name: Open upstream review issue
        if: env.UPSTREAM_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="upstream changes need personal review"
          COMMITS="$(cat "$GITHUB_WORKSPACE/upstream-commits.txt")"
          BODY="$(cat <<EOF
          Upstream changed and \`main\` was refreshed to the sanitized upstream mirror.

          Review these upstream commits and decide what should be cherry-picked into \`personal_changes\`:

          \`\`\`
          $COMMITS
          \`\`\`

          This issue is a notification only. Do not merge \`main\` into \`personal_changes\` blindly; \`personal_changes\` intentionally skips upstream repo/packaging changes that do not apply to this fork.
          EOF
          )"

          # issues are disabled on this fork; fall back to the run summary
          if [ "$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
            echo "Issues are disabled on this repo; writing the review note to the job summary instead."
            echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          EXISTING=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ -n "$EXISTING" ]; then
            echo "Existing upstream review issue #$EXISTING is open — adding a fresh comment."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "$TITLE" \
              --assignee "${{ github.repository_owner }}" \
              --body "$BODY"
          fi

      - name: Prune old runs of this workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pipefail so a gh failure fails the step instead of being swallowed by the pipe
          set -o pipefail
          # keep the 3 most recent completed runs; this run is still in progress so it is never a candidate
          gh run list --workflow "${{ github.workflow }}" --status completed --limit 100 \
            --json databaseId --jq '.[3:][].databaseId' |
            while read -r id; do
              echo "deleting run $id"
              gh run delete "$id"
            done
